[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-common"
version = "0.1.0"
description = "Infraestructura compartida de AegisVolt (logs JSON, sobre de mensajes, outbox, idempotencia, flags, circuit breaker). NO contiene modelos de dominio."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "boto3>=1.35",
  "aiokafka>=0.12",
  "httpx>=0.28",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.24", "moto[dynamodb]>=5.0"]

[tool.setuptools.packages.find]
include = ["aegis_common*"]

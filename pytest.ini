[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
testpaths = tests libs/aegis-common/tests
addopts = -m "not e2e"
markers =
    integration: pruebas que levantan varios servicios (en proceso o contra Compose)
    e2e: pruebas de extremo a extremo contra el stack completo (GraphQL)

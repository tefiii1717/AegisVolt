{{- $g := .Values.global -}}
# ---------- Ingress del BFF (stableIngress del canary con pesos exactos) ----------
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: graphql-bff
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 64k
    nginx.ingress.kubernetes.io/limit-rps: "50"
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /graphql
            pathType: Prefix
            backend: { service: { name: graphql-bff, port: { number: 4000 } } }
---
# ---------- Análisis del canary (proveedor web, funciona en Floci y en AWS) ----------
# Consulta /health/stats de los pods CANARY (Service <svc>-canary): errores del último minuto de la
# versión nueva. 3 mediciones cada 30 s; con 2 fallidas el rollout se aborta → rollback automático.
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: canary-error-rate-web
spec:
  args:
    - name: service
    - name: canary-url
    - name: version
  metrics:
    - name: canary-errors-last-minute
      interval: 30s
      count: 3
      failureLimit: 1
      successCondition: "result.errors_last_minute <= {{ $g.canary.maxErrors }}"
      provider:
        web:
          url: "{{ "{{" }}args.canary-url{{ "}}" }}"
          jsonPath: "{$}"
          timeoutSeconds: 5
---
# ---------- Análisis del canary con métricas de CloudWatch (alternativa en AWS real) ----------
# Cuenta los logs level=ERROR emitidos SOLO por la versión nueva (dimensión Version = tag de imagen).
# Se mide 3 veces cada 60 s; con 2 mediciones fallidas el rollout se aborta y vuelve a la versión estable.
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: canary-error-rate-cloudwatch
spec:
  args:
    - name: service
    - name: canary-url
    - name: version
  metrics:
    - name: canary-errors-per-minute
      interval: 60s
      count: 3
      failureLimit: 1
      successCondition: "len(result[0].Values) == 0 || all(result[0].Values, {# <= {{ $g.canary.maxErrors }}})"
      provider:
        cloudWatch:
          interval: 5m
          metricDataQueries:
            - id: errors
              metricStat:
                metric:
                  namespace: AegisVolt/{{ $g.environment }}
                  metricName: ErrorCount
                  dimensions:
                    - { name: Service, value: "{{ "{{" }}args.service{{ "}}" }}" }
                    - { name: Version, value: "{{ "{{" }}args.version{{ "}}" }}" }
                period: 60
                stat: Sum
---
# ---------- Configuración del sidecar Fluent Bit ----------
apiVersion: v1
kind: ConfigMap
metadata:
  name: fluent-bit-sidecar
data:
  fluent-bit.conf: |
    [SERVICE]
        Flush        2
        Log_Level    warn
        Parsers_File /fluent-bit/parsers/parsers.conf
    [INPUT]
        Name         tail
        Path         /var/log/aegis/*.log
        Parser       json
        Refresh_Interval 2
        Mem_Buf_Limit 5MB
    [OUTPUT]
        Name              cloudwatch_logs
        Match             *
        region            ${AWS_REGION}
        log_group_name    ${LOG_GROUP}
        log_stream_name   ${POD_NAME}
        auto_create_group false
  # Variante para Floci: mismo destino (CloudWatch Logs) pero contra el emulador.
  fluent-bit-floci.conf: |
    [SERVICE]
        Flush        2
        Log_Level    warn
        Parsers_File /fluent-bit/parsers/parsers.conf
    [INPUT]
        Name         tail
        Path         /var/log/aegis/*.log
        Parser       json
        Refresh_Interval 2
        Mem_Buf_Limit 5MB
    [OUTPUT]
        Name              cloudwatch_logs
        Match             *
        region            ${AWS_REGION}
        log_group_name    ${LOG_GROUP}
        log_stream_name   ${POD_NAME}
        endpoint          {{ $g.awsEndpoint | default "http://localhost:4566" | trimPrefix "http://" | trimPrefix "https://" | splitList ":" | first }}
        port              {{ $g.awsEndpoint | default "http://localhost:4566" | splitList ":" | last }}
        tls               Off
        auto_create_group true
---
# ---------- Aislamiento de red (zero-trust dentro del namespace) ----------
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-kafka-aws
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to: [{ namespaceSelector: {}, podSelector: { matchLabels: { k8s-app: kube-dns } } }]
      ports: [{ port: 53, protocol: UDP }, { port: 53, protocol: TCP }]
    - to: [{ namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: kafka } } }]
      ports: [{ port: 9092 }]
    # VPC Endpoints (DynamoDB por prefix list, Logs/STS/execute-api por ENI): solo HTTPS
    - ports: [{ port: 443 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: bff-ingress-and-egress
spec:
  podSelector: { matchLabels: { app.kubernetes.io/name: graphql-bff } }
  policyTypes: [Ingress, Egress]
  ingress:
    - from: [{ namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: ingress-nginx } } }]
      ports: [{ port: 4000 }]
  egress:
    - to: [{ podSelector: { matchExpressions: [{ key: app.kubernetes.io/name, operator: In,
             values: [query-projection, saga-orchestrator, legacy-csms, station-reservation, billing-wallet, energy-dispatch] }] } }]
      ports: [{ port: 8000 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: internal-http-from-bff-and-prefect
spec:
  podSelector: { matchExpressions: [{ key: app.kubernetes.io/name, operator: In,
                 values: [query-projection, saga-orchestrator, legacy-csms, station-reservation, billing-wallet, energy-dispatch] }] }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: { matchLabels: { app.kubernetes.io/name: graphql-bff } }
        - podSelector: { matchLabels: { app.kubernetes.io/name: prefect-flows } }
      ports: [{ port: 8000 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: dispatch-to-legacy
spec:
  podSelector: { matchLabels: { app.kubernetes.io/name: energy-dispatch } }
  policyTypes: [Egress]
  egress:
    - to: [{ podSelector: { matchLabels: { app.kubernetes.io/name: legacy-csms } } }]
      ports: [{ port: 8000 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: legacy-from-dispatch
spec:
  podSelector: { matchLabels: { app.kubernetes.io/name: legacy-csms } }
  policyTypes: [Ingress]
  ingress:
    - from: [{ podSelector: { matchLabels: { app.kubernetes.io/name: energy-dispatch } } }]
      ports: [{ port: 8000 }]

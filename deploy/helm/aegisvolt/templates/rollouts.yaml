{{- $root := . -}}
{{- $g := .Values.global -}}
{{- range $name, $svc := .Values.services }}
{{- $ctx := dict "root" $root "name" $name }}
{{- $port := default 8000 $svc.port }}
{{- $tag := default $g.imageTag $svc.imageTag }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  labels: {{- include "aegis.labels" $ctx | nindent 4 }}
  {{- if not $g.awsEndpoint }}
  annotations:
    # IRSA: rol IAM propio por servicio (solo su tabla DynamoDB). Lo crea Terraform (solo AWS real).
    eks.amazonaws.com/role-arn: arn:aws:iam::{{ $g.accountId }}:role/aegisvolt-{{ $g.environment }}-{{ $name }}
  {{- end }}
automountServiceAccountToken: true
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels: {{- include "aegis.labels" $ctx | nindent 4 }}
spec:
  type: ClusterIP
  selector: {{- include "aegis.selector" $ctx | nindent 4 }}
  ports: [{ name: http, port: {{ $port }}, targetPort: http }]
---
# Service del canary: Argo Rollouts lo apunta SOLO a los pods de la versión nueva.
# Lo usan ingress-nginx (peso exacto del BFF) y el análisis (consulta /health/stats del canary).
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}-canary
  labels: {{- include "aegis.labels" $ctx | nindent 4 }}
spec:
  type: ClusterIP
  selector: {{- include "aegis.selector" $ctx | nindent 4 }}
  ports: [{ name: http, port: {{ $port }}, targetPort: http }]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $name }}
spec:
  minAvailable: 1
  selector:
    matchLabels: {{- include "aegis.selector" $ctx | nindent 6 }}
---
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: {{ $name }}
  labels: {{- include "aegis.labels" $ctx | nindent 4 }}
spec:
  replicas: {{ $svc.replicas }}
  revisionHistoryLimit: 3
  selector:
    matchLabels: {{- include "aegis.selector" $ctx | nindent 6 }}
  strategy:
    {{- if eq (toString $svc.canary) "false" }}
    canary:
      steps: []                     # sistema heredado: reemplazo directo
    {{- else }}
    canary:
      stableService: {{ $name }}
      canaryService: {{ $name }}-canary
      {{- if $svc.trafficRouting }}
      trafficRouting:
        nginx:
          stableIngress: {{ $name }}
      {{- end }}
      # Sin trafficRouting (consumidores Kafka): el peso se aplica por RÉPLICAS → 1 de 5 pods ≈ 20 %
      # de las particiones del grupo de consumidores.
      steps:
        - setWeight: {{ $g.canary.weight }}
        - pause: { duration: {{ $g.canary.pauseSeconds }} }
        - analysis:
            templates: [{ templateName: canary-error-rate-{{ $g.canary.provider }} }]
            args:
              - { name: service, value: {{ $svc.serviceName | quote }} }
              # FQDN: el controlador de Argo Rollouts corre en otro namespace (argo-rollouts).
              - { name: canary-url, value: "http://{{ $name }}-canary.{{ $root.Release.Namespace }}.svc.cluster.local:{{ $port }}/health/stats" }
              - { name: version, value: {{ $tag | quote }} }
        - setWeight: 100
      # Si el análisis falla: abort → todo el tráfico vuelve a la versión estable (rollback automático).
      abortScaleDownDelaySeconds: 30
    {{- end }}
  template:
    metadata:
      labels: {{- include "aegis.labels" $ctx | nindent 8 }}
    spec:
      serviceAccountName: {{ $name }}
      securityContext: { runAsNonRoot: true, fsGroup: 10001 }
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: {{- include "aegis.selector" $ctx | nindent 14 }}
      volumes:
        - { name: logs, emptyDir: { sizeLimit: 128Mi } }
        - { name: tmp, emptyDir: {} }
        - { name: fluent-bit-config, configMap: { name: fluent-bit-sidecar } }
      initContainers:
        # SIDECAR NATIVO (K8s >= 1.29): arranca antes y termina después del contenedor principal.
        # Envía el archivo de logs JSON al grupo /aegisvolt/<env>/<servicio> de CloudWatch.
        - name: fluent-bit
          image: {{ $root.Values.fluentBit.image }}
          restartPolicy: Always
          env:
            - { name: LOG_GROUP, value: "/aegisvolt/{{ $g.environment }}/{{ $svc.serviceName }}" }
            - { name: AWS_REGION, value: {{ $g.region | quote }} }
            - { name: POD_NAME, valueFrom: { fieldRef: { fieldPath: metadata.name } } }
            {{- if $g.awsEndpoint }}
            - { name: DYNAMODB_ENDPOINT, value: {{ $g.awsEndpoint | quote }} }
            - { name: AWS_ENDPOINT_URL, value: {{ $g.awsEndpoint | quote }} }
            - { name: AWS_ACCESS_KEY_ID, value: "test" }
            - { name: AWS_SECRET_ACCESS_KEY, value: "test" }
            {{- end }}
          volumeMounts:
            - { name: logs, mountPath: /var/log/aegis, readOnly: true }
            - { name: fluent-bit-config, mountPath: /fluent-bit/etc/aegis }
          {{- if $g.awsEndpoint }}
          args: ["/fluent-bit/bin/fluent-bit", "-e", "/fluent-bit/cloudwatch.so", "-c", "/fluent-bit/etc/aegis/fluent-bit-floci.conf"]
          {{- else }}
          args: ["/fluent-bit/bin/fluent-bit", "-c", "/fluent-bit/etc/aegis/fluent-bit.conf"]
          {{- end }}
          resources: { requests: { cpu: 10m, memory: 32Mi }, limits: { cpu: 100m, memory: 64Mi } }
          securityContext: {{- include "aegis.securityContext" $ctx | nindent 12 }}
        {{- if $svc.outbox }}
        # SIDECAR: relay del Transactional Outbox (DynamoDB → Kafka) desacoplado del dominio.
        - name: outbox-relay
          image: "{{ $g.registry }}/{{ $name }}:{{ $tag }}"
          restartPolicy: Always
          command: ["python", "-m", "aegis_common.outbox"]
          env:
            - { name: SERVICE_NAME, value: {{ $svc.serviceName | quote }} }
            - { name: AEGIS_ENV, value: {{ $g.environment | quote }} }
            - { name: AWS_REGION, value: {{ $g.region | quote }} }
            - { name: TABLE_NAME, value: "aegisvolt-{{ $svc.table }}-{{ $g.environment }}" }
            - { name: KAFKA_BOOTSTRAP, value: {{ $g.kafkaBootstrap | quote }} }
            - { name: LOG_FILE, value: "/var/log/aegis/outbox.log" }
            {{- if $g.awsEndpoint }}
            - { name: DYNAMODB_ENDPOINT, value: {{ $g.awsEndpoint | quote }} }
            - { name: AWS_ENDPOINT_URL, value: {{ $g.awsEndpoint | quote }} }
            - { name: AWS_ACCESS_KEY_ID, value: "test" }
            - { name: AWS_SECRET_ACCESS_KEY, value: "test" }
            {{- end }}
          volumeMounts: [{ name: logs, mountPath: /var/log/aegis }]
          resources: { requests: { cpu: 20m, memory: 64Mi }, limits: { cpu: 200m, memory: 128Mi } }
          securityContext: {{- include "aegis.securityContext" $ctx | nindent 12 }}
        {{- end }}
      containers:
        - name: app
          image: "{{ $g.registry }}/{{ $name }}:{{ $tag }}"
          ports: [{ name: http, containerPort: {{ $port }} }]
          env:
            - { name: SERVICE_NAME, value: {{ $svc.serviceName | quote }} }
            - { name: AEGIS_ENV, value: {{ $g.environment | quote }} }
            - { name: APP_VERSION, value: {{ $tag | quote }} }
            - { name: AWS_REGION, value: {{ $g.region | quote }} }
            - { name: KAFKA_BOOTSTRAP, value: {{ $g.kafkaBootstrap | quote }} }
            - { name: FLAGS_TABLE, value: "aegisvolt-feature-flags-{{ $g.environment }}" }
            - { name: LOG_FILE, value: "/var/log/aegis/app.log" }
            {{- if $g.awsEndpoint }}
            - { name: DYNAMODB_ENDPOINT, value: {{ $g.awsEndpoint | quote }} }
            - { name: AWS_ENDPOINT_URL, value: {{ $g.awsEndpoint | quote }} }
            - { name: AWS_ACCESS_KEY_ID, value: "test" }
            - { name: AWS_SECRET_ACCESS_KEY, value: "test" }
            {{- end }}
            {{- if $svc.table }}
            - { name: TABLE_NAME, value: "aegisvolt-{{ $svc.table }}-{{ $g.environment }}" }
            - { name: OUTBOX_RELAY_MODE, value: {{ ternary "sidecar" "off" (default false $svc.outbox) | quote }} }
            {{- end }}
            {{- if eq $name "graphql-bff" }}
            - { name: AUTH_MODE, value: {{ $g.authMode | default "cognito" | quote }} }
            - { name: COGNITO_ISSUER, value: {{ $g.cognitoIssuer | quote }} }
            - { name: COGNITO_CLIENT_IDS, value: {{ $g.cognitoClientIds | quote }} }
            - { name: CORS_ORIGINS, value: {{ $g.corsOrigins | quote }} }
            - { name: FLAGS_API_URL, value: {{ $g.flagsApiUrl | quote }} }
            - { name: QUERY_SERVICE_URL, value: "http://query-projection:8000" }
            - { name: ORCHESTRATOR_URL, value: "http://saga-orchestrator:8000" }
            - { name: LEGACY_CSMS_URL, value: "http://legacy-csms:8000" }
            - { name: RESERVATION_URL, value: "http://station-reservation:8000" }
            - { name: BILLING_URL, value: "http://billing-wallet:8000" }
            - { name: DISPATCH_URL, value: "http://energy-dispatch:8000" }
            {{- end }}
            {{- range $k, $v := $svc.env }}
            - { name: {{ $k }}, value: {{ $v | quote }} }
            {{- end }}
          readinessProbe:
            httpGet: { path: /health/ready, port: http }
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /health/live, port: http }
            initialDelaySeconds: 15
            periodSeconds: 10
          startupProbe:
            httpGet: { path: /health/live, port: http }
            failureThreshold: 30
            periodSeconds: 2
          resources: {{- toYaml $root.Values.resources | nindent 12 }}
          securityContext: {{- include "aegis.securityContext" $ctx | nindent 12 }}
          volumeMounts:
            - { name: logs, mountPath: /var/log/aegis }
            - { name: tmp, mountPath: /tmp }
{{- end }}

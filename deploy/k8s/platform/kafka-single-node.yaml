# Kafka de UN broker para el EKS emulado por Floci (un solo nodo k3s en el portátil).
# Generado desde kafka.yaml: réplicas 1, RF 1, min.insync 1, 2 GiB.
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaNodePool
metadata:
  name: dual-role
  namespace: kafka
  labels: { strimzi.io/cluster: aegisvolt }
spec:
  replicas: 1
  roles: [controller, broker]
  storage:
    type: jbod
    volumes: [{ id: 0, type: persistent-claim, size: 2Gi, deleteClaim: false, kraftMetadata: shared }]
---
apiVersion: kafka.strimzi.io/v1beta2
kind: Kafka
metadata:
  name: aegisvolt
  namespace: kafka
  annotations:
    strimzi.io/node-pools: enabled
    strimzi.io/kraft: enabled
spec:
  kafka:
    version: 3.8.0
    resources: { requests: { cpu: 200m, memory: 768Mi }, limits: { memory: 1Gi } }
    listeners:
      - { name: plain, port: 9092, type: internal, tls: false }
    config:
      default.replication.factor: 1
      min.insync.replicas: 1
      offsets.topic.replication.factor: 1
      transaction.state.log.replication.factor: 1
      transaction.state.log.min.isr: 1
      auto.create.topics.enable: false
  entityOperator:
    topicOperator: {}
---
